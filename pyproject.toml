[project]
name = "incidentagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # LangChain core — always required
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",

    # Config and environment
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Observability
    "langsmith>=0.1.0",

    # API layer (phase 2)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Agent graph
    "langgraph>=0.2.0",

    # Hybrid retrieval
    "rank-bm25>=0.2.2",

    # Eval utilities
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Install only what your chosen provider needs.
# e.g.  uv pip install -e ".[openai]"
#        uv pip install -e ".[anthropic,ollama]"
#        uv pip install -e ".[all]"

openai = [
    "langchain-openai>=0.2.0",
]

anthropic = [
    "langchain-anthropic>=0.3.0",
]

ollama = [
    "langchain-ollama>=0.2.0",
]

# sentence-transformers is large (~500MB). Use only for fully local/offline setups.
huggingface = [
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]

# Installs every provider — useful for development and CI.
all = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# Streamlit demo UI — run with: streamlit run demo/app.py
demo = [
    "streamlit>=1.35.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
