services:

  # ── Ingestion ────────────────────────────────────────────────────────────────
  # Runs once to populate ChromaDB from the runbook corpus.
  # Safe to re-run — upserts by deterministic chunk ID, no duplicates.
  ingest:
    build: .
    command: python -m src.ingestion.loader
    env_file: .env
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      # host.docker.internal is the correct address for reaching Ollama on the
      # host machine from inside a container. If OLLAMA_BASE_URL is set in .env,
      # that value takes precedence; otherwise this default is used.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - chroma_data:/app/data/chroma_db
    restart: "no"

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Demo UI ──────────────────────────────────────────────────────────────────
  demo:
    build: .
    command: streamlit run demo/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE: http://api:8000
    volumes:
      - ./demo:/app/demo
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
